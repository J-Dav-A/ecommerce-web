<div class="container py-5">
  <div class="text-center py-4">
    <i class="fa-solid fa-gamepad fa-3x text-primary mb-3"></i>
    <h1 class="display-5">Marketplace de Videojuegos</h1>
    <p class="lead text-muted">
      Compra claves digitales de tus juegos favoritos para PC, PlayStation, Xbox y Nintendo.
    </p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <a routerLink="/catalogo" class="btn btn-primary">
        <i class="fa-solid fa-store me-1"></i>Ver catálogo
      </a>
      @if (!auth.isAuthenticated()) {
        <a routerLink="/login" class="btn btn-outline-primary">
          <i class="fa-solid fa-right-to-bracket me-1"></i>Iniciar sesión
        </a>
      }
    </div>
  </div>
</div>
