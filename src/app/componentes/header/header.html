<nav class="navbar navbar-expand-md bg-body-tertiary shadow-sm">
  <div class="container">

    <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2">
      <i class="fa-solid fa-gamepad"></i>
      <span>Marketplace de Videojuegos</span>
    </a>

    <!-- Botón hamburguesa: solo se ve en pantallas pequeñas -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu"
            aria-controls="navMenu" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
            <i class="fa-solid fa-house me-1"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">
            <i class="fa-solid fa-store me-1"></i>Catálogo
          </a>
        </li>
        <!-- Las opciones privadas se agregan aquí dentro de @if (auth.isAuthenticated()) { ... } -->
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if (auth.isAuthenticated()) {
          <span class="text-muted small">
            <i class="fa-solid fa-user me-1"></i>{{ auth.usuario()?.nombre }}
            <span class="badge text-bg-secondary ms-1">{{ auth.rol() }}</span>
          </span>
          <button class="btn btn-outline-danger btn-sm" type="button" (click)="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn btn-outline-primary btn-sm">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Iniciar sesión
          </a>
        }
      </div>
    </div>
  </div>
</nav>
